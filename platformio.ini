[platformio]
default_envs = cores3

[env]
platform = espressif32@8.0.0
framework = arduino
lib_deps = m5stack/M5Unified@0.3.0
monitor_speed = 115200

; Square tabletop compact: CoreS3 K128 on its DinBase.
[env:cores3]
board = m5stack-cores3
board_build.embed_files = assets/loft-compact.jpg
; The standard CoreS3 has quad-SPI PSRAM, so the board's default memory type is correct.
build_src_filter = +<main.cpp>
; RFID2 unit (U031-B) on the red Port A reads the Moon Prism stickers.
lib_deps =
  m5stack/M5Unified@0.3.0
  kkloesener/MFRC522_I2C@1.0

; Pocket Luna, the pet on the StickS3 K150 (ESP32-S3-PICO-1-N8R8, 8 MB flash).
[env:pocket]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_src_filter = +<pocket.cpp>
; Gesture Unit (U127, PAJ7620U2) on the stick's Grove port lets Tanya play with Luna in the air.
lib_deps =
  m5stack/M5Unified@0.3.0
  dfrobot/DFRobot_PAJ7620U2
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
